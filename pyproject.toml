[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scqsim"
version = "1.0.0.dev0"
description = "Representation-neutral quantum realization and gate analysis for superconducting circuits."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "qutip>=5.3.1,<6",
  "scqubits>=4.3.1,<5",
]

[project.urls]
Homepage = "https://github.com/OrPenStrike/scqsim"
Issues = "https://github.com/OrPenStrike/scqsim/issues"
Repository = "https://github.com/OrPenStrike/scqsim"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "ruff>=0.13,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scqsim = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/scqsim"]
